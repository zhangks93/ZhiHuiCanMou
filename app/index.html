<!doctype html>
<html lang="zh-CN" data-theme="canmou">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
    <title>智汇参谋 · 企业智能助手</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(180deg, #f8fbff 0%, #eff4fb 48%, #edf2f8 100%);
        color: #1e293b;
        overflow: hidden;
        min-height: 100vh;
      }

      /* 背景光晕 */
      .bg-orb {
        position: fixed;
        border-radius: 9999px;
        pointer-events: none;
        z-index: 0;
      }
      .bg-orb-1 {
        top: -8rem; right: -6rem;
        width: 32rem; height: 32rem;
        background: radial-gradient(circle, rgba(95, 127, 188, 0.10), transparent 65%);
        filter: blur(12px);
      }
      .bg-orb-2 {
        bottom: -6rem; left: -4rem;
        width: 24rem; height: 24rem;
        background: radial-gradient(circle, rgba(142, 169, 213, 0.14), transparent 60%);
        filter: blur(10px);
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-card {
        position: relative;
        text-align: center;
        padding: 2.75rem 3rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow:
          0 20px 54px rgba(15, 23, 42, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* 卡片顶部高光线 */
      .loading-card::before {
        content: '';
        position: absolute;
        top: 0; left: 2rem; right: 2rem;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(95, 127, 188, 0.3), transparent);
        border-radius: 9999px;
      }

      /* Logo 图标区域 */
      .logo-wrap {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1.5px solid rgba(95, 127, 188, 0.18);
        animation: ringPulse 3s ease-in-out infinite;
      }

      .logo-ring-outer {
        inset: -10px;
        border-color: rgba(95, 127, 188, 0.08);
        animation-delay: 0.4s;
      }

      .logo-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(95, 127, 188, 0.12);
        box-shadow:
          0 12px 28px rgba(95, 127, 188, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: iconFloat 3.2s ease-in-out infinite;
        overflow: hidden;
      }

      .logo-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 旋转轨道点 */
      .orbit-dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #5f7fbc;
        box-shadow: 0 0 8px rgba(95, 127, 188, 0.6);
        top: 50%;
        left: 50%;
        transform-origin: 0 0;
        animation: orbitSpin 4s linear infinite;
      }

      .loading-title {
        font-size: 1.25rem;
        font-weight: 500;
        color: #0f172a;
        letter-spacing: -0.02em;
        margin-bottom: 0.35rem;
        font-family: 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      .loading-subtitle {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 2rem;
        letter-spacing: 0.01em;
      }

      /* 进度条 */
      .progress-track {
        width: 180px;
        height: 3px;
        margin: 0 auto;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #5f7fbc, #7d99ca);
        box-shadow: 0 0 8px rgba(95, 127, 188, 0.4);
        animation: progressSlide 1.6s ease-in-out infinite;
      }

      /* 底部提示点 */
      .loading-dots {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 1.25rem;
      }

      .loading-dots span {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgba(95, 127, 188, 0.35);
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

      /* Keyframes */
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(16px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes ringPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%       { opacity: 1;   transform: scale(1.04); }
      }

      @keyframes iconFloat {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-3px); }
      }

      @keyframes orbitSpin {
        0%   { transform: rotate(0deg) translateX(38px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
      }

      @keyframes progressSlide {
        0%   { width: 0%;   margin-left: 0; }
        40%  { width: 60%;  margin-left: 0; }
        60%  { width: 60%;  margin-left: 40%; }
        100% { width: 0%;   margin-left: 100%; }
      }

      @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(1);   opacity: 0.35; }
        40%            { transform: scale(1.4); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div id="loading-screen">
      <div class="loading-card">
        <div class="logo-wrap">
          <div class="logo-ring logo-ring-outer"></div>
          <div class="logo-ring"></div>
          <div class="logo-icon">
            <img src="./logo.png" alt="智汇参谋 Logo" />
          </div>
          <div class="orbit-dot"></div>
        </div>

        <h1 class="loading-title">智汇参谋</h1>
        <p class="loading-subtitle">企业智能助手 · 让协作更智能</p>

        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>

        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
