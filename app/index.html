<!doctype html>
<html lang="zh-CN" data-theme="canmou">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>智汇参谋 · 企业智能助手</title>
    <style>
      :root {
        --primary-dark: #0a0e27;
        --primary-blue: #1a2847;
        --accent-cyan: #00d9ff;
        --accent-electric: #6366f1;
        --accent-warm: #f59e0b;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Noto Sans SC', sans-serif;
        background: var(--primary-dark);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-dark);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-container {
        text-align: center;
        position: relative;
      }

      .logo-animation {
        width: 120px;
        height: 120px;
        margin: 0 auto 2rem;
        position: relative;
      }

      .evolution-stages {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .stage {
        width: 60px;
        height: 60px;
        border: 2px solid var(--accent-cyan);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        font-size: 0.75rem;
        color: var(--accent-cyan);
        background: rgba(0, 217, 255, 0.05);
        animation: stageGlow 2s ease-in-out infinite;
        position: relative;
      }

      .stage:nth-child(1) { animation-delay: 0s; }
      .stage:nth-child(2) { animation-delay: 0.3s; border-color: var(--accent-electric); color: var(--accent-electric); background: rgba(99, 102, 241, 0.05); }
      .stage:nth-child(3) { animation-delay: 0.6s; border-color: var(--accent-warm); color: var(--accent-warm); background: rgba(245, 158, 11, 0.05); }

      @keyframes stageGlow {
        0%, 100% { box-shadow: 0 0 10px currentColor; transform: scale(1); }
        50% { box-shadow: 0 0 25px currentColor; transform: scale(1.05); }
      }

      .stage-arrow {
        color: var(--text-secondary);
        font-size: 1.5rem;
        align-self: center;
        animation: arrowPulse 1.5s ease-in-out infinite;
      }

      @keyframes arrowPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .loading-title {
        font-family: 'Orbitron', monospace;
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-electric), var(--accent-warm));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      .loading-subtitle {
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 2rem;
      }

      .progress-bar {
        width: 300px;
        height: 3px;
        background: var(--primary-blue);
        border-radius: 2px;
        overflow: hidden;
        margin: 0 auto;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-electric));
        animation: progressLoad 2s ease-in-out infinite;
      }

      @keyframes progressLoad {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      .bg-pattern {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.4;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
        animation: bgShift 20s ease-in-out infinite;
      }

      @keyframes bgShift {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(20px, -20px) scale(1.1); }
      }

      .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridMove 30s linear infinite;
      }

      @keyframes gridMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }
    </style>
  </head>
  <body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div id="loading-screen">
      <div class="loading-container">
        <div class="evolution-stages">
          <div class="stage">P→P</div>
          <div class="stage-arrow">→</div>
          <div class="stage">P→A→P</div>
          <div class="stage-arrow">→</div>
          <div class="stage">A→A→P</div>
        </div>

        <h1 class="loading-title">智汇参谋</h1>
        <p class="loading-subtitle">企业智能助手 · 让协作更智能</p>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
