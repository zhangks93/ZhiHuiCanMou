<!doctype html>
<html lang="zh-CN" data-theme="canmou">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>智汇参谋 · 企业智能助手</title>
    <style>
      :root {
        --primary-dark: #0a0e27;
        --primary-blue: #1a2847;
        --accent-cyan: #00d9ff;
        --accent-electric: #6366f1;
        --accent-warm: #f59e0b;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Noto Sans SC', sans-serif;
        background: var(--primary-dark);
        color: var(--text-primary);
        overflow: hidden;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-dark);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-container {
        text-align: center;
        position: relative;
        padding: 2rem 1.5rem;
      }

      .logo-animation {
        width: 140px;
        height: 140px;
        margin: 0 auto 1.75rem;
        position: relative;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 20%, rgba(148, 163, 184, 0.4), transparent 55%),
          radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.35), transparent 60%);
        box-shadow:
          0 0 0 1px rgba(148, 163, 184, 0.3),
          0 0 40px rgba(56, 189, 248, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      .logo-core {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 20%, #f9fafb, #0ea5e9);
        box-shadow:
          0 0 18px rgba(56, 189, 248, 0.8),
          0 0 50px rgba(129, 140, 248, 0.7);
        position: relative;
        animation: corePulse 2.8s ease-in-out infinite;
      }

      .logo-core::before {
        content: '';
        position: absolute;
        inset: -18px;
        border-radius: inherit;
        border: 1px solid rgba(148, 163, 184, 0.6);
        box-shadow: 0 0 24px rgba(148, 163, 184, 0.4);
        opacity: 0.7;
      }

      .logo-orbit {
        position: absolute;
        inset: 18px;
        border-radius: 999px;
        border: 1px dashed rgba(148, 163, 184, 0.5);
        box-shadow: 0 0 30px rgba(15, 23, 42, 0.8);
      }

      .logo-orbit::before {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent-cyan);
        box-shadow:
          0 0 12px rgba(56, 189, 248, 0.9),
          0 0 28px rgba(129, 140, 248, 0.9);
        top: 50%;
        left: 100%;
        transform: translate(-50%, -50%);
        animation: orbitDot 4s linear infinite;
        transform-origin: -40px;
      }

      @keyframes orbitDot {
        0% {
          transform: rotate(0deg) translate(-40px) translateY(-50%);
        }
        100% {
          transform: rotate(360deg) translate(-40px) translateY(-50%);
        }
      }

      @keyframes corePulse {
        0%, 100% {
          transform: scale(1);
          box-shadow:
            0 0 14px rgba(56, 189, 248, 0.7),
            0 0 40px rgba(129, 140, 248, 0.6);
        }
        50% {
          transform: scale(1.05);
          box-shadow:
            0 0 22px rgba(56, 189, 248, 1),
            0 0 60px rgba(129, 140, 248, 0.9);
        }
      }

      .loading-title {
        font-family: 'Orbitron', monospace;
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-electric), var(--accent-warm));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      .loading-subtitle {
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 1.75rem;
      }

      .progress-bar {
        width: 240px;
        height: 2px;
        background: rgba(15, 23, 42, 0.9);
        border-radius: 999px;
        overflow: hidden;
        margin: 0 auto;
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.8);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-electric));
        animation: progressLoad 1.8s ease-in-out infinite;
      }

      @keyframes progressLoad {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      .bg-pattern {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.3;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.18) 0%, transparent 55%),
          radial-gradient(circle at 80% 75%, rgba(129, 140, 248, 0.18) 0%, transparent 55%);
        animation: bgShift 20s ease-in-out infinite;
      }

      @keyframes bgShift {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(20px, -20px) scale(1.1); }
      }

      .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridMove 30s linear infinite;
      }

      @keyframes gridMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }
    </style>
  </head>
  <body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div id="loading-screen">
      <div class="loading-container">
        <div class="logo-animation">
          <div class="logo-core"></div>
          <div class="logo-orbit"></div>
        </div>

        <h1 class="loading-title">智汇参谋</h1>
        <p class="loading-subtitle">企业智能助手 · 让协作更智能</p>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
