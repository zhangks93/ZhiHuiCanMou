name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Lint frontend
        run: npm run lint --prefix app

      - name: Build frontend
        run: npm run build --prefix app

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.mjs --source docs --out .pages-artifact

      - name: Check public artifacts
        run: node scripts/check-public-artifacts.mjs --dir .pages-artifact

      - name: Check RLS policies
        run: node scripts/check-rls-policies.mjs

      - name: Check for hardcoded secrets
        run: node scripts/check-no-secrets.mjs

  rust-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust format check
        run: cargo fmt --check
