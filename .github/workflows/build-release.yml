name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'app-v*'

# `tauri-action` can also upload app bundles to an existing GitHub release.
# This workflow uses different actions to create and publish the release.
# `tauri-action` will only build and upload the app bundles to the specified release.

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./app/package.json').version")" >> $GITHUB_ENV

      - name: create or get release
        id: create-release
        uses: actions/github-script@v6
        with:
          script: |
            const tagName = `app-v${process.env.PACKAGE_VERSION}`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              core.info(`Release for ${tagName} already exists, reusing id ${data.id}`);
              // 删除已有 assets，避免重复上传时报 already_exists
              const { data: assets } = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id
              });
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
                core.info(`Deleted existing asset: ${asset.name}`);
              }
              return data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `智汇参谋 v${process.env.PACKAGE_VERSION}`,
              body: 'See the assets to download this version and install.',
              draft: true,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci --prefix app

      - name: prepare bundled lark-cli (windows)
        if: matrix.platform == 'windows-latest'
        run: npm run prepare:lark-cli --prefix app

      - uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FEISHU_APP_ID: ${{ secrets.VITE_FEISHU_APP_ID }}
          VITE_FEISHU_REDIRECT_URI: ${{ secrets.VITE_FEISHU_REDIRECT_URI }}
          VITE_FEISHU_SCOPE: ${{ secrets.VITE_FEISHU_SCOPE }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  build-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platform-tools build-tools;36.0.0 ndk;26.1.10909125'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android'

      - name: set Android env
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$HOME/.android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: setup debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: install frontend dependencies
        run: npm ci --prefix app

      - name: init Android project
        working-directory: app
        run: npm run tauri:android:init

      - name: build Android APK (multi-arch)
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FEISHU_APP_ID: ${{ secrets.VITE_FEISHU_APP_ID }}
          VITE_FEISHU_REDIRECT_URI: ${{ secrets.VITE_FEISHU_REDIRECT_URI }}
          VITE_FEISHU_SCOPE: ${{ secrets.VITE_FEISHU_SCOPE }}
        run: npm run build:apk

      - name: list generated APKs
        run: |
          echo "Generated APK files:"
          if [ -d app/src-tauri/gen/android/app/build/outputs/apk ]; then
            find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          else
            echo "No APK directory found at app/src-tauri/gen/android/app/build/outputs/apk"
          fi

      - name: upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="app-v$VERSION"
          if [ -d app/src-tauri/gen/android/app/build/outputs/apk ]; then
            find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec gh release upload "$TAG" {} --clobber \;
          else
            echo "No APK directory found at app/src-tauri/gen/android/app/build/outputs/apk, skip upload"
          fi

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, build-android]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
