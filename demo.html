<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>东部区域收入与税前利润贡献结构（累计至2月）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        #container {
            width: 1200px;
            height: 500px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        var chartDom = document.getElementById('container');
        var myChart = echarts.init(chartDom);
        
        // 数据准备（单位：万元）
        var nodes = [
            '亳州配送', '嘉祥配送', '利辛配送', '亳州食堂雇员派遣', 
            '武夷山餐饮项目', '鸠江配送', '武夷山物业项目', 
            '武夷山便利店项目', '帕瓦项目', '东部区域总经理室'
        ];
        
        var revenue = [4600.35, 1104.23, 849.33, 470.94, 93.71, 42.40, 13.02, 3.63, 0, 0];
        var profit = [127.66, -17.05, -27.73, -150.43, 12.34, -25.12, 0.38, -2.44, -1.78, -189.24];
        
        var option = {
            title: {
                text: '东部区域收入与税前利润贡献结构呈现两极分化',
                subtext: '累计至2026年2月（单位：万元）',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    var result = params[0].name + '<br/>';
                    params.forEach(function(item) {
                        result += item.seriesName + ': ' + item.value.toFixed(2) + '万元<br/>';
                    });
                    return result;
                }
            },
            legend: {
                data: ['营业收入', '税前利润'],
                top: 30
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: nodes,
                axisLabel: {
                    rotate: 45
                }
            },
            yAxis: [
                {
                    type: 'value',
                    name: '营业收入（万元）',
                    position: 'left'
                },
                {
                    type: 'value',
                    name: '税前利润（万元）',
                    position: 'right'
                }
            ],
            series: [
                {
                    name: '营业收入',
                    type: 'bar',
                    data: revenue,
                    itemStyle: {
                        color: '#5470c6'
                    },
                    yAxisIndex: 0
                },
                {
                    name: '税前利润',
                    type: 'bar',
                    data: profit,
                    itemStyle: {
                        color: function(params) {
                            return params.value >= 0 ? '#91cc75' : '#ee6666';
                        }
                    },
                    yAxisIndex: 1
                }
            ]
        };
        
        myChart.setOption(option);
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
